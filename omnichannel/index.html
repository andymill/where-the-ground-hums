function compute(s) {
  const n = s.skus.length || 1;

    const dtcOrders = (custOnline + custBrand) * (s.ordersPerCust || 0);
    const dtcUnits = dtcOrders;
    const dtcRev = dtcUnits * aov;
    const wsUnits = (s.stores[y] || 0) * (s.unitsPerDoor || 0);
    const wsRev = wsUnits * wholesalePrice;
    const revenue = dtcRev + wsRev;
    const units = dtcUnits + wsUnits;
    const cogs = units * cogsUnit;
    const grossProfit = revenue - cogs;

    // fulfillment: DTC ships per-order, wholesale ships in bulk per-unit
    const dtcFulfill = dtcOrders * (s.dtcFulfillPerOrder || 0);
    const wsFulfill = wsUnits * (s.wsFreightPerUnit || 0);
    const fulfillment = dtcFulfill + wsFulfill;

    const avgInvUnits = Math.max((s.weeksCover || 0) / 52 * units, totalMOQ / 2);
    const avgInvValue = avgInvUnits * cogsUnit;
    const warehousing = avgInvValue * (s.holdingPct || 0) / 100;
    const writeoff = avgInvValue * (s.writeoffPct || 0) / 100;
    let payroll = 0,
      headEmp = 0,
      headCon = 0;
    for (const r of s.team) {
      if (r.who === "none") continue;
      if (r.startYr - 1 > y) continue;
      let annual = r.model === "hourly" ? (r.amount || 0) * (r.hoursWk || 0) * 52 : r.amount || 0;

      wsRev,
      revenue,
      cogs,
      grossProfit,
      dtcFulfill,
      wsFulfill,
      fulfillment,
      avgInvValue,
      warehousing,
      writeoff,
      payroll,
      onlineMk,
      brandMk,
      brokerFees,
      insurance,
      overhead,
      opex,
      ebitda,
      units,
      dtcUnits,
      wsUnits,
