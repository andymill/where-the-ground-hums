<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ginko House — Renovation Review</title>
<style>
  :root{
    --bg:#f4f1ea; --card:#ffffff; --ink:#22302e; --muted:#6b7a76;
    --teal:#1f4e5f; --teal2:#2e7d6b; --amber:#caa24a; --line:#e4ded2;
    --cogs:#2e7d6b; --labor:#b5772a; --shadow:0 6px 22px rgba(31,78,95,.12);
    --maxw:760px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
  a{color:var(--teal)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 14px}
  /* top bar */
  header.bar{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.92);
    backdrop-filter:saturate(150%) blur(10px);border-bottom:1px solid var(--line)}
  .bar .wrap{display:flex;align-items:center;gap:10px;height:54px}
  .bar .back{border:0;background:transparent;font-size:17px;color:var(--teal);
    font-weight:600;display:none;align-items:center;gap:4px;cursor:pointer;padding:8px 6px 8px 0}
  .bar .title{font-weight:700;font-size:16px;letter-spacing:.2px;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{background:var(--teal);color:#fff;border-radius:999px;font-weight:700;
    font-size:13px;padding:6px 12px;white-space:nowrap}
  /* hero */
  .hero{position:relative;border-radius:0 0 22px 22px;overflow:hidden}
  .hero img{width:100%;display:block;height:46vh;min-height:240px;max-height:420px;object-fit:cover}
  .hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.62))}
  .hero .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 20px;color:#fff}
  .hero h1{margin:0 0 4px;font-size:26px;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.4)}
  .hero p{margin:0;opacity:.95;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .hero .tot{display:inline-flex;align-items:baseline;gap:8px;margin-top:12px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
    padding:8px 14px;border-radius:14px;backdrop-filter:blur(4px)}
  .hero .tot b{font-size:22px}.hero .tot span{font-size:12px;opacity:.9}
  .lead{margin:18px 4px 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.10em;font-weight:700}
  /* room grid */
  .grid{display:grid;grid-template-columns:1fr;gap:14px;margin:10px 0 22px}
  @media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
  .roomcard{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;
    box-shadow:var(--shadow);border:1px solid var(--line);background:#000;
    transition:transform .12s ease}
  .roomcard:active{transform:scale(.985)}
  .roomcard img{width:100%;height:188px;object-fit:cover;display:block;opacity:.92}
  .roomcard .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.0) 35%,rgba(0,0,0,.72))}
  .roomcard .meta{position:absolute;left:0;right:0;bottom:0;padding:13px 14px;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  .roomcard .nm{font-weight:700;font-size:17px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
  .roomcard .ct{font-weight:800;font-size:16px;text-shadow:0 1px 8px rgba(0,0,0,.55);white-space:nowrap}
  .roomcard .tag{position:absolute;top:10px;left:10px;background:rgba(31,78,95,.85);
    color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;letter-spacing:.03em}
  /* budget block */
  .budget{background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);padding:16px;margin:6px 0 26px}
  .budget h3{margin:0 0 12px;font-size:16px;color:var(--teal)}
  .brow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
  .brow:last-of-type{border-bottom:0}
  .brow.tot{font-weight:800;font-size:18px;color:var(--teal);border-top:2px solid var(--line);margin-top:4px;padding-top:12px}
  .brow .sub{color:var(--muted);font-size:12px;display:block}
  .splitbar{height:14px;border-radius:8px;overflow:hidden;display:flex;margin:14px 0 6px;border:1px solid var(--line)}
  .splitbar i{display:block;height:100%}
  .legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .legend b{color:var(--ink)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
  /* materials takeoff */
  .takeoff{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:18px}
  .tkgrp{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:14px 2px 6px}
  .tkgrp:first-child{margin-top:0}
  .tkrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .tkrow:last-child{border-bottom:0}
  .tkrow .lbl{font-size:15px;font-weight:600}
  .tkrow .rooms{display:block;color:var(--muted);font-size:11.5px;font-weight:400;margin-top:2px}
  .tkrow .qv{white-space:nowrap;font-weight:800;color:var(--teal);font-size:16px}
  .tkrow .qv small{color:var(--muted);font-weight:600;font-size:12px;margin-left:3px}
  .tknote{color:var(--muted);font-size:11.5px;margin:12px 2px 0;line-height:1.45}
  /* phasing */
  .tot .herosub{display:block;font-size:12px;opacity:.85;margin-top:3px;font-weight:500}
  .planner{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 14px 14px;box-shadow:var(--shadow);margin-bottom:6px}
  .plrow{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:11px 2px;border-bottom:1px dashed var(--line)}
  .plrow:last-of-type{border-bottom:0}
  .plrow .pl-nm{font-size:14.5px;font-weight:600;line-height:1.2}
  .plrow .pl-ct{font-size:12px;color:var(--muted);margin-top:1px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);flex:none}
  .seg button{border:0;border-left:1px solid var(--line);background:transparent;padding:7px 9px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;min-width:38px}
  .seg button:first-child{border-left:0}
  .seg button.on{background:var(--teal);color:#fff}
  .seg button.on.offsel{background:var(--muted)}
  .plnote{color:var(--muted);font-size:11.5px;margin:11px 2px 0;line-height:1.45}
  .roomcard .pchip{position:absolute;top:9px;right:9px;z-index:2;font-size:10.5px;font-weight:800;letter-spacing:.02em;padding:3px 8px;border-radius:999px;background:rgba(31,78,95,.92);color:#fff}
  .roomcard .pchip.future{background:rgba(181,119,42,.95)}
  .roomcard .pchip.offsel{background:rgba(107,122,118,.95)}
  .roomcard.dim img{filter:saturate(.5) brightness(.93)}
  .phbreak{margin:2px 0 4px}
  .phrow{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
  .phrow .ph-k .sub{color:var(--muted);font-size:12px;display:block;font-weight:400}
  .phrow.excl{color:var(--muted)}
  .phrow.planned{font-weight:800;color:var(--teal);border-top:2px solid var(--line);border-bottom:0;margin-top:3px;padding-top:11px}
  .scopehd{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:16px 2px 8px}
  .scopetabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .scopetabs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
  .scopetabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .labortoggle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 14px;flex-wrap:wrap}
  .labortoggle .lt-k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .schedbadge{display:inline-block;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(31,78,95,.10);color:var(--teal);margin:0 0 10px}
  .schedbadge.future{background:rgba(181,119,42,.13);color:var(--labor)}
  .schedbadge.offsel{background:rgba(107,122,118,.14);color:var(--muted)}
  /* detail */
  .detail{display:none}
  .ba{position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin:16px 0 8px;background:#000}
  .ba img{width:100%;display:block;height:54vw;max-height:360px;min-height:200px;object-fit:cover}
  .ba .lab{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.62);color:#fff;
    font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;letter-spacing:.04em}
  .toggle{position:absolute;bottom:12px;right:12px;display:flex;background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.5);border-radius:999px;overflow:hidden;backdrop-filter:blur(6px)}
  .toggle button{border:0;background:transparent;color:#fff;font-weight:700;font-size:13px;
    padding:8px 15px;cursor:pointer}
  .toggle button.on{background:#fff;color:var(--teal)}
  .cnav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;border:0;cursor:pointer;
    width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:22px;line-height:1;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
  .cnav:active{transform:translateY(-50%) scale(.92)}
  .cnav.prev{left:10px} .cnav.next{right:10px}
  .caplabel{position:absolute;top:12px;right:12px;z-index:3;background:rgba(0,0,0,.62);color:#fff;
    font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:999px;letter-spacing:.02em}
  .cdots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:7px}
  .cdot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer;transition:all .15s}
  .cdot.on{background:#fff;width:20px;border-radius:5px}
  .blurb{font-size:15px;color:#384744;margin:10px 2px 16px}
  .chips{display:flex;gap:10px;margin:0 0 18px;flex-wrap:wrap}
  .chip{flex:1;min-width:96px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 12px;box-shadow:var(--shadow)}
  .chip .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .chip .v{font-size:19px;font-weight:800;margin-top:2px}
  .chip.c .v{color:var(--cogs)} .chip.l .v{color:var(--labor)} .chip.t .v{color:var(--teal)}
  .sech{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.10em;font-weight:700;margin:6px 2px 10px}
  /* line items */
  .line{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:11px;box-shadow:var(--shadow)}
  .line .d{font-weight:650;font-size:15px;margin-bottom:7px}
  .line .nums{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
  .qty{color:var(--muted);margin-right:auto}
  .amt{font-weight:700;border-radius:8px;padding:3px 9px;font-size:12.5px;white-space:nowrap}
  .amt.c{background:rgba(46,125,107,.12);color:var(--cogs)}
  .amt.l{background:rgba(181,119,42,.13);color:var(--labor)}
  .reflink{display:flex;align-items:center;gap:9px;margin-top:10px;padding-top:10px;
    border-top:1px dashed var(--line);text-decoration:none;color:var(--teal);font-size:13px;font-weight:600}
  .reflink img,.reflink .fav{width:30px;height:30px;border-radius:7px;flex:0 0 30px;object-fit:cover;
    border:1px solid var(--line);background:#fff}
  .reflink .rt{flex:1;line-height:1.25}
  .reflink .rt small{display:block;color:var(--muted);font-weight:500;font-size:11px}
  .reflink .go{color:var(--muted);font-size:16px}
  .noref{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
  /* footer */
  .foot{margin:14px 0 40px;text-align:center}
  .dlbtn{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#fff;
    text-decoration:none;font-weight:700;font-size:15px;padding:13px 20px;border-radius:14px;box-shadow:var(--shadow)}
  .disc{font-size:11.5px;color:var(--muted);margin:16px 6px 0;line-height:1.5}
  .view{animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <button class="back" id="back">‹ House</button>
    <div class="title" id="bartitle">Ginko House Renovation</div>
    <div class="pill" id="barpill">—</div>
  </div>
</header>

<!-- HOME -->
<section id="home" class="view">
  <div class="hero">
    <img src="assets/hero.jpg" alt="The house" loading="eager">
    <div class="ov"></div>
    <div class="cap">
      <h1>Ginko House Renovation</h1>
      <p>Brattleboro, VT · mid-range finish · tap a room to explore</p>
      <div class="tot"><b id="herototal">—</b><span id="herocap">estimated project total</span><span id="herosub" class="herosub"></span></div>
    </div>
  </div>
  <div class="wrap">
    <div class="lead">Rooms</div>
    <div class="grid" id="grid"></div>
    <div class="lead">Plan by year</div>
    <div class="planner" id="planner"></div>
    <div class="lead">Budget by year</div>
    <div class="budget" id="budget"></div>
    <div class="lead">Materials takeoff</div>
    <div class="takeoff" id="takeoff"></div>
    <div class="foot">
      <a class="dlbtn" href="Ginko_Renovation_Cost_Sheet.xlsx" download>⬇︎ Download the cost spreadsheet</a>
      <p class="disc" id="disc"></p>
    </div>
  </div>
</section>

<!-- ROOM DETAIL -->
<section id="room" class="view" style="display:none">
  <div class="wrap" id="roombody"></div>
</section>

<script src="data.js"></script>
<script>
const D = window.RENO_DATA;
const $ = s => document.querySelector(s);
const usd = n => '$' + Math.round(n).toLocaleString('en-US');

/* ---- Phasing: schedule each room by year (this year / future) or mark Off ----
   OH&P (15%) and contingency (12%) are percentages, so a phase's totals are
   computed the same way as the whole project — summing per phase equals the
   whole. Selections persist per-device in localStorage. */
const PHASES = [
  {key:'2026', short:'2026', tab:'This year', label:'This year (2026)'},
  {key:'2027', short:'2027', tab:'2027',      label:'2027'},
  {key:'2028', short:'2028', tab:'2028',      label:'2028'},
  {key:'off',  short:'Off',  tab:'Off',       label:'Not planned'},
];
const PHASE_DEFAULTS = {};
// Default everything to this year, except the Great Room — deferred to 2027
// (no urgent needs).
D.rooms.forEach(r => PHASE_DEFAULTS[r.slug] = (r.slug === 'living' ? '2027' : '2026'));
function loadPhases(){
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('ginko_phase') || '{}'); } catch(e){}
  const out = {};
  D.rooms.forEach(r => out[r.slug] = saved[r.slug] || PHASE_DEFAULTS[r.slug]);
  return out;
}
let PHASE = loadPhases();
let viewScope = '2026';
function setPhase(slug, key){
  PHASE[slug] = key;
  try { localStorage.setItem('ginko_phase', JSON.stringify(PHASE)); } catch(e){}
  renderHome();
}
function setScope(s){ viewScope = s; renderBudget(); renderTakeoff(); }

/* ---- Labor mode: flat-rate market estimate vs. our contractor @ $65/hr ----
   Each line carries an estimated `hours`; hourly labor = hours × rate. Flat
   labor (the original market estimate) is the line's `labor`. Materials (cogs)
   are unaffected. Selection persists per-device. */
const LABOR_RATE = 65;
let laborMode = 'flat';
try { if(localStorage.getItem('ginko_labor') === 'hourly') laborMode = 'hourly'; } catch(e){}
function setLaborMode(m){
  laborMode = m;
  try { localStorage.setItem('ginko_labor', m); } catch(e){}
  route(); // re-render the current view (home or room detail)
}
function lineLabor(l){ return laborMode === 'hourly' ? Math.round((l.hours || 0) * LABOR_RATE) : l.labor; }
function roomLabor(r){ return r.lines.reduce((s,l)=>s + lineLabor(l), 0); }
function roomTotalC(r){ return r.cogs + roomLabor(r); }
function roomHours(r){ return r.lines.reduce((s,l)=>s + (l.hours || 0), 0); }
function resetPhases(){
  PHASE = Object.assign({}, PHASE_DEFAULTS);
  try { localStorage.removeItem('ginko_phase'); } catch(e){}
  renderHome();
}
function phaseMeta(key){ return PHASES.find(p => p.key === key); }
function roomsInScope(scope){
  if(scope === 'all') return D.rooms.filter(r => PHASE[r.slug] !== 'off');
  return D.rooms.filter(r => PHASE[r.slug] === scope);
}
function totalsFor(rooms){
  const cogs = rooms.reduce((s,r)=>s + r.cogs, 0);
  const labor = rooms.reduce((s,r)=>s + roomLabor(r), 0);
  const subtotal = cogs + labor;
  const ohp = Math.round(subtotal * 0.15);
  const contingency = Math.round((subtotal + ohp) * 0.12);
  return {cogs, labor, subtotal, ohp, contingency, project: subtotal + ohp + contingency, n: rooms.length};
}

// retailer color/initials for fallback favicon badge
const BRAND = {
  'www.homedepot.com':['#f96302','HD'], 'www.angi.com':['#ff6153','A'],
  'www.ziprecruiter.com':['#1c5ee1','ZR'], 'www.brattleboro.gov':['#345','VT']
};
function badge(domain){
  const b = BRAND[domain] || ['#1f4e5f',(domain||'?').replace('www.','').slice(0,2).toUpperCase()];
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><rect width='60' height='60' rx='12' fill='${b[0]}'/><text x='50%' y='54%' font-family='Arial' font-size='24' font-weight='700' fill='#fff' text-anchor='middle' dominant-baseline='middle'>${b[1]}</text></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
function favHTML(domain){
  if(!domain) return '';
  const live = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
  return `<img class="fav" src="${live}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${badge(domain)}'">`;
}

function renderHome(){
  const thisYear = totalsFor(roomsInScope('2026'));
  const planned = totalsFor(roomsInScope('all'));
  $('#herototal').textContent = usd(thisYear.project);
  $('#herocap').textContent = 'estimated · this year (2026)';
  $('#herosub').textContent = (planned.project > thisYear.project)
    ? 'Full plan ' + usd(planned.project) + ' across 2026–2028'
    : '';
  $('#barpill').textContent = usd(thisYear.project);

  const g = $('#grid'); g.innerHTML = '';
  D.rooms.forEach(r=>{
    const ph = PHASE[r.slug], m = phaseMeta(ph);
    const chipCls = ph === '2026' ? '' : (ph === 'off' ? 'offsel' : 'future');
    const chipTxt = ph === '2026' ? 'This yr' : m.short;
    const el = document.createElement('div');
    el.className = 'roomcard' + (ph === '2026' ? '' : ' dim');
    el.innerHTML = `<span class="tag">Renovated</span>
      <span class="pchip ${chipCls}">${chipTxt}</span>
      <img src="${r.after}" alt="${r.name}" loading="lazy">
      <div class="ov"></div>
      <div class="meta"><span class="nm">${r.name}</span><span class="ct">${usd(roomTotalC(r))}</span></div>`;
    el.onclick = ()=>{ location.hash = '#/room/'+r.slug; };
    g.appendChild(el);
  });

  renderPlanner();
  renderBudget();
  renderTakeoff();
  $('#disc').textContent = 'Planning-level estimate from listing photos and renovation renders — not a contractor bid. Actual costs vary with selections, hidden conditions, and local bids. Material links open current retail references.';
}

// Per-room year planner: assign each room to a year or "Off". Saved per-device.
function renderPlanner(){
  let html = '';
  D.rooms.forEach(r=>{
    const ph = PHASE[r.slug];
    const seg = PHASES.map(p =>
      `<button class="${p.key === ph ? 'on' : ''}${p.key === 'off' && p.key === ph ? ' offsel' : ''}"
        onclick="setPhase('${r.slug}','${p.key}')">${p.short}</button>`).join('');
    html += `<div class="plrow"><div><div class="pl-nm">${r.name}</div>
      <div class="pl-ct">${usd(roomTotalC(r))}</div></div>
      <div class="seg">${seg}</div></div>`;
  });
  html += `<p class="plnote">Schedule each room — “This year” is 2026; push others to 2027/2028 or mark “Off”.
    Your plan is saved on this device. <a href="#" onclick="resetPhases();return false;" style="color:var(--teal);font-weight:600">Reset to default</a></p>`;
  $('#planner').innerHTML = html;
}

// Budget split by year, plus a detailed estimate for the selected scope.
function renderBudget(){
  let rows = '';
  let plannedHard = 0;
  PHASES.forEach(p=>{
    const rooms = D.rooms.filter(r => PHASE[r.slug] === p.key);
    const hard = rooms.reduce((s,r)=>s + roomTotalC(r), 0);
    const nlabel = rooms.length + ' room' + (rooms.length === 1 ? '' : 's');
    if(p.key === 'off'){
      rows += `<div class="phrow excl"><span class="ph-k">Not planned <span class="sub">${nlabel} · excluded</span></span><span>—</span></div>`;
    } else {
      plannedHard += hard;
      rows += `<div class="phrow"><span class="ph-k">${p.label} <span class="sub">${nlabel}</span></span><b>${usd(hard)}</b></div>`;
    }
  });
  rows += `<div class="phrow planned"><span>Total planned — hard costs</span><span>${usd(plannedHard)}</span></div>`;

  const scopeList = PHASES.filter(p => p.key !== 'off').concat([{key:'all', tab:'All planned'}]);
  const tabs = scopeList.map(p =>
    `<button class="${viewScope === p.key ? 'on' : ''}" onclick="setScope('${p.key}')">${p.tab}</button>`).join('');

  const scopeRooms = roomsInScope(viewScope);
  const scopeHours = scopeRooms.reduce((s,r)=>s + roomHours(r), 0);
  const flatLabor = scopeRooms.reduce((s,r)=>s + r.lines.reduce((a,l)=>a + l.labor, 0), 0);
  const t = totalsFor(scopeRooms);
  const scopeName = viewScope === 'all' ? 'All planned (2026–2028)' : phaseMeta(viewScope).label;
  let rollup;
  if(t.n === 0){
    rollup = `<p class="tknote" style="margin-top:0">No rooms assigned to ${scopeName} — use the planner above to schedule rooms here.</p>`;
  } else {
    const cogsPct = Math.round(t.cogs / t.subtotal * 100), laborPct = 100 - cogsPct;
    const laborSub = laborMode === 'hourly' ? `${Math.round(scopeHours).toLocaleString('en-US')} hrs × $${LABOR_RATE}/hr` : 'market flat-rate estimate';
    const compare = laborMode === 'hourly'
      ? `<p class="tknote" style="margin-top:10px">At your contractor’s <b>$${LABOR_RATE}/hr</b>, labor is ${usd(t.labor)} vs. the flat-rate estimate of ${usd(flatLabor)} — ${flatLabor>=t.labor?'about '+usd(flatLabor-t.labor)+' lower':usd(t.labor-flatLabor)+' higher'}. Hours are estimates (materials unchanged).</p>`
      : '';
    rollup = `<div class="brow"><span>Materials (COGS)</span><b>${usd(t.cogs)}</b></div>
    <div class="brow"><span>Labor <span class="sub">${laborSub}</span></span><b>${usd(t.labor)}</b></div>
    <div class="brow"><span>Subtotal — hard costs <span class="sub">${t.n} room${t.n === 1 ? '' : 's'}</span></span><b>${usd(t.subtotal)}</b></div>
    <div class="brow"><span>GC overhead &amp; profit <span class="sub">15% of subtotal</span></span><b>${usd(t.ohp)}</b></div>
    <div class="brow"><span>Contingency <span class="sub">12% of subtotal + OH&amp;P</span></span><b>${usd(t.contingency)}</b></div>
    <div class="brow tot"><span>${scopeName} total</span><span>${usd(t.project)}</span></div>
    <div class="splitbar"><i style="width:${cogsPct}%;background:var(--cogs)"></i><i style="width:${laborPct}%;background:var(--labor)"></i></div>
    <div class="legend"><span><span class="dot" style="background:var(--cogs)"></span>Materials <b>${cogsPct}%</b></span>
      <span><span class="dot" style="background:var(--labor)"></span>Labor <b>${laborPct}%</b></span></div>${compare}`;
  }
  const laborTog = `<div class="labortoggle"><span class="lt-k">Labor pricing</span><div class="seg">
      <button class="${laborMode==='flat'?'on':''}" onclick="setLaborMode('flat')">Flat-rate</button>
      <button class="${laborMode==='hourly'?'on':''}" onclick="setLaborMode('hourly')">Our crew · $${LABOR_RATE}/hr</button>
    </div></div>`;
  $('#budget').innerHTML = `<h3>Budget by year</h3>
    ${laborTog}
    <div class="phbreak">${rows}</div>
    <div class="scopehd">Detailed estimate</div>
    <div class="scopetabs">${tabs}</div>
    ${rollup}`;
}

// Project-wide materials takeoff: aggregate the area/linear line-item
// quantities (sq ft, lin ft) into material buckets, computed from RENO_DATA
// so it stays in sync with the per-room numbers. Per-unit fixtures, lump-sum
// (ls) and appliance/plumbing/demo lines are intentionally excluded — they're
// not area-based and are itemized on each room page.
function renderTakeoff(){
  const groups = [
    ['Wood / boards', ['Wood flooring — refinish', 'Engineered wood flooring (new)', 'Wood wall & ceiling boards — T&G paneling, wainscot']],
    ['Tile', ['Tile — floors', 'Tile — walls (backsplash, surrounds, wainscot)']],
    ['Cabinets & counters', ['Cabinets — semi-custom run', 'Butcher-block countertop']],
    ['Paint & ceilings', ['Paint — walls & ceilings', 'Popcorn ceiling removal + skim']],
  ];
  const unitOf = {
    'Cabinets — semi-custom run':'lin ft',
  }; // everything else is sq ft
  function bucket(desc, unit){
    const d = desc.toLowerCase();
    const tile = /tile|slate|terracotta|saltillo|hex/.test(d);
    if(unit === 'sq ft'){
      if(/refinish.*floor/.test(d)) return 'Wood flooring — refinish';
      if(/engineered|stuga/.test(d)) return 'Engineered wood flooring (new)';
      if(tile && /floor/.test(d)) return 'Tile — floors';
      if(tile && /(backsplash|surround|wainscot|tub wall|wall)/.test(d)) return 'Tile — walls (backsplash, surrounds, wainscot)';
      if(/paneling|wainscot/.test(d)) return 'Wood wall & ceiling boards — T&G paneling, wainscot';
      if(/butcher block|countertop/.test(d)) return 'Butcher-block countertop';
      if(/popcorn/.test(d)) return 'Popcorn ceiling removal + skim';
      if(/paint/.test(d)) return 'Paint — walls & ceilings';
    } else if(unit === 'lin ft'){
      if(/cabinet/.test(d)) return 'Cabinets — semi-custom run';
    }
    return null;
  }
  const scopeRooms = roomsInScope(viewScope);
  const scopeName = viewScope === 'all' ? 'all planned years' : phaseMeta(viewScope).label;
  const agg = {};
  scopeRooms.forEach(r => r.lines.forEach(l => {
    const b = bucket(l.desc, l.unit);
    if(!b) return;
    (agg[b] = agg[b] || {total:0, rooms:[]});
    agg[b].total += Number(l.qty) || 0;
    agg[b].rooms.push(r.name + ' ' + Number(l.qty).toLocaleString('en-US'));
  }));
  if(!Object.keys(agg).length){
    $('#takeoff').innerHTML = `<p class="tknote" style="margin-top:0">No area-based materials scheduled for ${scopeName}.</p>`;
    return;
  }
  let html = `<div class="scopehd" style="margin-top:0">Scope: ${scopeName}</div>`;
  for(const [grp, labels] of groups){
    const present = labels.filter(l => agg[l]);
    if(!present.length) continue;
    html += `<div class="tkgrp">${grp}</div>`;
    for(const lab of present){
      const a = agg[lab];
      html += `<div class="tkrow"><div><span class="lbl">${lab}</span>
        <span class="rooms">${a.rooms.join(' · ')}</span></div>
        <span class="qv">${a.total.toLocaleString('en-US')}<small>${unitOf[lab] || 'sq ft'}</small></span></div>`;
    }
  }
  html += `<p class="tknote">Takeoff quantities are derived from the room line items — floor areas are actual room dimensions from the listing; wall paneling uses measured perimeters at 8-ft ceilings (≈12% deducted for doors/windows). Fixtures, appliances, lighting, plumbing and demo are priced per unit or lump-sum on each room page and aren't area-based.</p>`;
  $('#takeoff').innerHTML = html;
}

function renderRoom(slug){
  const r = D.rooms.find(x=>x.slug===slug);
  if(!r){ location.hash=''; return; }
  $('#bartitle').textContent = r.name;
  $('#barpill').textContent = usd(roomTotalC(r));
  const lines = r.lines.map(li=>{
    const ref = li.url
      ? `<a class="reflink" href="${li.url}" target="_blank" rel="noopener">
           ${favHTML(li.domain)}
           <span class="rt">${li.ref}<small>${li.domain.replace('www.','')}</small></span>
           <span class="go">↗</span></a>`
      : `<div class="noref">No material reference (labor / soft cost)</div>`;
    const cogs = li.cogs>0 ? `<span class="amt c">Materials ${usd(li.cogs)}</span>`:'';
    const ll = lineLabor(li);
    const labor = ll>0 ? `<span class="amt l">Labor ${usd(ll)}${laborMode==='hourly' && li.hours ? ` · ${li.hours}h×$${LABOR_RATE}` : ''}</span>`:'';
    return `<div class="line"><div class="d">${li.desc}</div>
      <div class="nums"><span class="qty">${li.qty} ${li.unit}</span>${cogs}${labor}</div>
      ${ref}</div>`;
  }).join('');
  $('#roombody').innerHTML = `
    <div class="ba">
      <img id="baimg" src="" alt="${r.name}">
      <span class="lab" id="balab">Renovated</span>
      <button class="cnav prev" id="cPrev" aria-label="Previous view">‹</button>
      <button class="cnav next" id="cNext" aria-label="Next view">›</button>
      <span class="caplabel" id="caplabel"></span>
      <div class="cdots" id="cdots"></div>
      <div class="toggle">
        <button id="tBefore">Now</button><button id="tAfter" class="on">Renovated</button>
      </div>
    </div>
    <p class="blurb">${r.blurb}</p>
    <div class="${'schedbadge ' + (PHASE[r.slug] === '2026' ? '' : (PHASE[r.slug] === 'off' ? 'offsel' : 'future'))}">${PHASE[r.slug] === '2026' ? '📅 Scheduled this year (2026)' : (PHASE[r.slug] === 'off' ? '⏸ Not planned' : '📅 Scheduled for ' + PHASE[r.slug])} · change in “Plan by year”</div>
    <div class="chips">
      <div class="chip c"><div class="k">Materials</div><div class="v">${usd(r.cogs)}</div></div>
      <div class="chip l"><div class="k">Labor</div><div class="v">${usd(roomLabor(r))}</div></div>
      <div class="chip t"><div class="k">Room total</div><div class="v">${usd(roomTotalC(r))}</div></div>
    </div>
    <div class="labortoggle"><span class="lt-k">Labor pricing</span><div class="seg">
      <button class="${laborMode==='flat'?'on':''}" onclick="setLaborMode('flat')">Flat-rate</button>
      <button class="${laborMode==='hourly'?'on':''}" onclick="setLaborMode('hourly')">Our crew · $${LABOR_RATE}/hr</button>
    </div></div>
    <div class="sech">Line items · ${r.lines.length}${laborMode==='hourly' ? ` · ${Math.round(roomHours(r))} hrs` : ''}</div>
    ${lines}
    <div class="foot"><a class="dlbtn" href="Ginko_Renovation_Cost_Sheet.xlsx" download>⬇︎ Full spreadsheet</a></div>`;
  // Carousel: a room can carry multiple before/after pairs (r.pairs); a
  // single before/after still works as a one-slide carousel.
  const pairs = (r.pairs && r.pairs.length) ? r.pairs : [{before:r.before, after:r.after, label:''}];
  const img=$('#baimg'), lab=$('#balab'), tb=$('#tBefore'), ta=$('#tAfter');
  const dots=$('#cdots'), capl=$('#caplabel'), prev=$('#cPrev'), next=$('#cNext');
  const multi = pairs.length > 1;
  if(multi){ dots.innerHTML = pairs.map((p,i)=>`<span class="cdot" data-i="${i}"></span>`).join(''); }
  else { prev.style.display='none'; next.style.display='none'; dots.style.display='none'; capl.style.display='none'; }
  let ci=0, side='after';
  function show(){
    const p = pairs[ci];
    img.src = side==='after' ? p.after : p.before;
    lab.textContent = side==='after' ? 'Renovated' : 'Now (current)';
    ta.classList.toggle('on', side==='after'); tb.classList.toggle('on', side==='before');
    if(multi){ capl.textContent = p.label || ('View '+(ci+1)+' / '+pairs.length);
      dots.querySelectorAll('.cdot').forEach((d,i)=>d.classList.toggle('on', i===ci)); }
  }
  tb.onclick=()=>{ side='before'; show(); };
  ta.onclick=()=>{ side='after';  show(); };
  if(multi){
    prev.onclick=()=>{ ci=(ci-1+pairs.length)%pairs.length; show(); };
    next.onclick=()=>{ ci=(ci+1)%pairs.length; show(); };
    dots.querySelectorAll('.cdot').forEach(d=> d.onclick=()=>{ ci=+d.dataset.i; show(); });
  }
  show();
}

function route(){
  const m = location.hash.match(/^#\/room\/(.+)$/);
  if(m){
    $('#home').style.display='none';
    $('#room').style.display='block';
    $('#back').style.display='inline-flex';
    document.querySelector('.detail');
    renderRoom(m[1]);
    window.scrollTo(0,0);
  } else {
    $('#room').style.display='none';
    $('#home').style.display='block';
    $('#back').style.display='none';
    $('#bartitle').textContent='Ginko House Renovation';
    renderHome();
    window.scrollTo(0,0);
  }
}
$('#back').onclick=()=>{ location.hash=''; };
window.addEventListener('hashchange', route);
renderHome();
route();
</script>
</body>
</html>
