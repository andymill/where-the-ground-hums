<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>25-27 Gingko Lane, Brattleboro, VT 05301</title>
  <meta name="description" content="Owner-occupied triplex — cash upfront + all-in monthly" />
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; background: #F6F2E9; }
    * { box-sizing: border-box; }
    @media (max-width: 620px) {
      .stats { grid-template-columns: 1fr !important; }
    }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState } = React;

// ---------------------------------------------------------------------------
// Brattleboro Triplex — minimal house-hack calculator.
// Three occupancy toggles (1B unit, 2B unit, the current house as a rental).
// Outputs exactly two numbers: cash needed upfront, and all-in monthly cost.
// ---------------------------------------------------------------------------

const GOLD = "#A07B2B";
const GOLD_FILL = "#C9A24B";
const GOLD_DIM = "#8A7338";
const BG = "#F6F2E9";
const PANEL = "#FFFFFF";
const LINE = "#E4DECE";
const TEXT = "#262219";
const MUTED = "#8C8472";
const POS = "#4E8A46";
const SHADOW = "0 1px 2px rgba(60,50,20,0.05), 0 10px 30px rgba(60,50,20,0.05)";

const fmt = (n) =>
  isFinite(n)
    ? n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 })
    : "—";

// Fixed deal assumptions — $450K purchase, 10% down, 6.25% 30-yr, $100K reno.
const BASE = {
  price: 450000, down: 45000, rate: 6.25, term: 30, pmiMo: 74.25,
  propTax: 10800, insurance: 1800, rentalUtils: 5287, maintPct: 8, vacancyPct: 5,
  closing: 12800, prepaids: 6400, repairs: 100000,
  curCost: 1800,                       // monthly carry on the current house
  rentalElec: 0, snow: 1000, trash: 450, bWaterSewer: 0, pest: 300,
  pHeat: 2400, pElec: 1400, pWaterSewer: 900, pInternet: 840,
};

// Monthly rent each rental brings in when occupied.
const RENT = { b2: 1700, b1: 1300, house: 2800 };

function compute(s) {
  const loan = Math.max(0, s.price - s.down);
  const downPct = (s.down / s.price) * 100;
  const r = s.rate / 100 / 12;
  const n = s.term * 12;
  const pi = r > 0 ? (loan * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1) : loan / n;
  const pmiMo = downPct < 20 ? (s.pmiMo || 0) : 0;

  const grossRentMo = s.unit1Rent + s.unit2Rent;
  const grossRentYr = grossRentMo * 12;
  const vacMo = (grossRentYr * s.vacancyPct) / 100 / 12;
  const maintMo = (grossRentYr * s.maintPct) / 100 / 12;

  const piti = pi + s.propTax / 12 + s.insurance / 12 + pmiMo;
  const otherBldgMo = (s.rentalElec + s.snow + s.trash + s.bWaterSewer + s.pest) / 12;
  const totalNut = piti + s.rentalUtils / 12 + maintMo + vacMo + otherBldgMo;
  const netHousingCost = totalNut - grossRentMo;

  const personalMo = (s.pHeat + s.pElec + s.pWaterSewer + s.pInternet) / 12;
  const trueAllInMo = netHousingCost + personalMo;

  const cashUpfront = s.down + s.closing + s.prepaids + s.repairs;
  const houseNetMo = s.curRent > 0 ? s.curRent - s.curCost : 0;  // net only when rented

  return { cashUpfront, monthlyAllIn: trueAllInMo - houseNetMo };
}

function Toggle({ label, sub, on, onClick }) {
  return (
    <button
      onClick={onClick}
      style={{
        flex: "1 1 0", minWidth: 96, cursor: "pointer", textAlign: "center",
        padding: "18px 10px", borderRadius: 14, fontFamily: "inherit",
        border: `2px solid ${on ? GOLD : LINE}`,
        background: on ? "linear-gradient(135deg, #FFFCF1, #FBF3DE)" : PANEL,
        boxShadow: on ? SHADOW : "none", transition: "all 150ms ease",
      }}
    >
      <div style={{ fontFamily: "'Funnel Display', sans-serif", fontWeight: 800, fontSize: 22, color: on ? GOLD : MUTED }}>{label}</div>
      <div style={{ fontSize: 12, color: MUTED, marginTop: 4 }}>{sub}</div>
      <div style={{ fontSize: 10.5, letterSpacing: 1.5, textTransform: "uppercase", marginTop: 8, fontWeight: 700, color: on ? POS : MUTED }}>
        {on ? "occupied" : "vacant"}
      </div>
    </button>
  );
}

function Stat({ label, value, sub }) {
  return (
    <div style={{ background: PANEL, border: `1px solid ${LINE}`, borderRadius: 16, padding: "24px 26px", boxShadow: SHADOW }}>
      <div style={{ color: MUTED, fontSize: 12, letterSpacing: 0.5, textTransform: "uppercase" }}>{label}</div>
      <div style={{ fontFamily: "'Funnel Display', sans-serif", fontWeight: 800, fontSize: 40, color: GOLD, lineHeight: 1.1, marginTop: 8, fontVariantNumeric: "tabular-nums" }}>{value}</div>
      {sub && <div style={{ color: MUTED, fontSize: 12.5, marginTop: 6 }}>{sub}</div>}
    </div>
  );
}

function Calculator() {
  // Default occupancy = today's reality: 2B rented, 1B vacant, house not let.
  const [b2, setB2] = useState(true);
  const [b1, setB1] = useState(false);
  const [house, setHouse] = useState(false);

  const m = compute({
    ...BASE,
    unit1Rent: b2 ? RENT.b2 : 0,
    unit2Rent: b1 ? RENT.b1 : 0,
    curRent: house ? RENT.house : 0,
  });

  return (
    <div style={{ background: BG, minHeight: "100%", padding: "48px 20px", fontFamily: "'Funnel Sans', sans-serif" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600;700;800&family=Funnel+Sans:wght@300;400;500;600;700&display=swap');`}</style>

      <div style={{ maxWidth: 720, margin: "0 auto" }}>
        <div style={{ color: GOLD_DIM, fontSize: 12, letterSpacing: 3, textTransform: "uppercase" }}>House-hack · owner-occupied triplex</div>
        <h1 style={{ fontFamily: "'Funnel Display', sans-serif", fontWeight: 800, fontSize: 30, color: TEXT, margin: "8px 0 6px", letterSpacing: -0.5, lineHeight: 1.15 }}>25-27 Gingko Lane, Brattleboro, VT</h1>
        <div style={{ color: MUTED, fontSize: 13.5 }}>$450K · 10% down ($45K) · 6.25% 30-yr · $100K reno</div>

        {/* Occupancy toggles — flip each rental on/off */}
        <div style={{ display: "flex", gap: 12, marginTop: 28, flexWrap: "wrap" }}>
          <Toggle label="1B" sub={`${fmt(RENT.b1)}/mo`} on={b1} onClick={() => setB1(!b1)} />
          <Toggle label="2B" sub={`${fmt(RENT.b2)}/mo`} on={b2} onClick={() => setB2(!b2)} />
          <Toggle label="House" sub={`${fmt(RENT.house)}/mo`} on={house} onClick={() => setHouse(!house)} />
        </div>

        {/* The two numbers */}
        <div className="stats" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginTop: 16 }}>
          <Stat label="Cash in upfront" value={fmt(m.cashUpfront)} sub="Down + closing + prepaids + $100K reno" />
          <Stat label="Monthly cost all-in" value={`${fmt(m.monthlyAllIn)}/mo`} sub="To live here, after rents from occupied units" />
        </div>
      </div>
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById("root")).render(<Calculator />);
  </script>
</body>
</html>
